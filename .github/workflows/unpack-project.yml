name: Unpack capstone project source

on:
  workflow_dispatch:
  push:
    paths:
      - 'LittleLemon-capstone-project.zip'
      - '.github/workflows/unpack-project.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project source
        run: |
          unzip -o LittleLemon-capstone-project.zip
          rm LittleLemon-capstone-project.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand complete Little Lemon project source'
          git push

