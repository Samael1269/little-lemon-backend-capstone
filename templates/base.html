{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Little Lemon{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'restaurant/css/style.css' %}">
</head>
<body>
    <header>
        <a class="brand" href="{% url 'home' %}" aria-label="Little Lemon home">
            <img src="{% static 'restaurant/img/logo.svg' %}" alt="Little Lemon">
        </a>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'menu' %}">Menu</a>
            <a href="{% url 'book' %}">Book</a>
            <a href="{% url 'reservations' %}">Reservations</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
        <img src="{% static 'restaurant/img/lemon.svg' %}" alt="">
        <span>Copyright Little Lemon</span>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
